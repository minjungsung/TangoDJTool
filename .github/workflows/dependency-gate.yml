name: Dependency Gate
on:
  pull_request:
  push:
    branches:
      - "main"

concurrency:
  group: dependency-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-dependencies:
    permissions:
      contents: read
    uses: minjungsung/.github/.github/workflows/dependency-validation.yml@420baeba4da71d4d955ee3b28d49dcc9a9a1f898
    with:
      pr-author: dependabot[bot]
      projects-json: '[{"name":"android-gradle","ecosystem":"gradle","path":"android","runtime-version":"21","manifest":"build.gradle","gradle-wrapper":"gradlew","timeout-minutes":30},{"name":"root-node","ecosystem":"npm","path":".","runtime-version":"24","manifest":"package.json","lockfile":"package-lock.json","test-command":"npm test","timeout-minutes":15}]'
      policy-ref: 420baeba4da71d4d955ee3b28d49dcc9a9a1f898

  dependency-gate:
    name: dependency-gate
    if: always()
    needs: validate-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require dependency validation success
        env:
          VALIDATION_RESULT: ${{ needs.validate-dependencies.result }}
        run: test "$VALIDATION_RESULT" = success

