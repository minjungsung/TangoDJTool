name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (for example v1.0.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      checks: read
    uses: minjungsung/.github/.github/workflows/release.yml@bc75215fd512d65213a14b4165901e966d6841f2
    with:
      version: ${{ github.event.inputs.version || github.ref_name }}
